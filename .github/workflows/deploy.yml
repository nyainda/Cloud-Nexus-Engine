name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck-and-deploy:
    name: Typecheck, Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "node_version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared libs
        run: pnpm run typecheck:libs

      - name: Build frontend (validates Vite + all deps work)
        run: pnpm --filter @workspace/greenlink-app build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: https://greenlink-pos-api.bruce42oyugi.workers.dev

      - name: Deploy Cloudflare Worker
        run: pnpm --filter @workspace/api-server run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
