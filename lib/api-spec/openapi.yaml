openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GreenLink & Sunrise Agrovet Retail Operations OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: PIN-based authentication
  - name: shops
    description: Shop management
  - name: products
    description: Product catalog and inventory
  - name: aliases
    description: Product aliases for OCR matching
  - name: sales
    description: Sales transactions
  - name: debts
    description: Debt management
  - name: inventory
    description: Inventory movement tracking
  - name: notifications
    description: Notification center
  - name: audit
    description: Audit trail
  - name: suppliers
    description: Supplier management
  - name: reports
    description: Analytics and reports
  - name: ocr
    description: OCR scanning
  - name: import
    description: Excel/bulk import
  - name: storage
    description: File storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: PIN login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get current session
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: No session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/verify-pin:
    post:
      operationId: verifyOwnerPin
      tags: [auth]
      summary: Verify owner PIN for privileged action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPinInput"
      responses:
        "200":
          description: PIN verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── SHOPS ───────────────────────────────────────────────
  /shops:
    get:
      operationId: listShops
      tags: [shops]
      summary: List all shops
      responses:
        "200":
          description: List of shops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"
    post:
      operationId: createShop
      tags: [shops]
      summary: Create a shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopInput"
      responses:
        "201":
          description: Shop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/{shopId}:
    get:
      operationId: getShop
      tags: [shops]
      summary: Get shop by ID
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"
    patch:
      operationId: updateShop
      tags: [shops]
      summary: Update shop
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  # ─── PRODUCTS ────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List/search products
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
          description: Search query (fuzzy)
        - name: category
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          schema:
            type: string
          description: Filter to low stock only
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Soft-delete product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /products/{productId}/restock:
    post:
      operationId: restockProduct
      tags: [products]
      summary: Restock product (adds stock + creates inventory movement)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockInput"
      responses:
        "200":
          description: Restocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{productId}/price-history:
    get:
      operationId: getProductPriceHistory
      tags: [products]
      summary: Get product price history
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceHistory"

  /products/bulk-import:
    post:
      operationId: bulkImportProducts
      tags: [import]
      summary: Bulk import products from parsed Excel data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  # ─── PRODUCT ALIASES ─────────────────────────────────────
  /products/{productId}/aliases:
    get:
      operationId: listProductAliases
      tags: [aliases]
      summary: List aliases for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aliases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductAlias"
    post:
      operationId: createProductAlias
      tags: [aliases]
      summary: Add alias to product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductAliasInput"
      responses:
        "201":
          description: Alias created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAlias"

  /aliases/{aliasId}:
    delete:
      operationId: deleteProductAlias
      tags: [aliases]
      summary: Delete alias
      parameters:
        - name: aliasId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── SALES ───────────────────────────────────────────────
  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List sales
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
          description: Filter by date (YYYY-MM-DD), defaults to today
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sales list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Record a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "201":
          description: Sale recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

  /sales/{saleId}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get sale with items
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleWithItems"
    delete:
      operationId: deleteSale
      tags: [sales]
      summary: Remove sale (restores stock)
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSaleInput"
      responses:
        "204":
          description: Sale removed

  /sales/{saleId}/returns:
    get:
      operationId: listSaleReturns
      tags: [sales]
      summary: List returns for a sale
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaleReturn"
    post:
      operationId: createSaleReturn
      tags: [sales]
      summary: Process a customer return (partial or full)
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleReturnInput"
      responses:
        "201":
          description: Return processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleReturn"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── DEBTS ───────────────────────────────────────────────
  /debts:
    get:
      operationId: listDebts
      tags: [debts]
      summary: List debts
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status (unpaid|partial|paid|cancelled)
        - name: q
          in: query
          schema:
            type: string
          description: Search by customer name/phone
      responses:
        "200":
          description: Debts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debt"
    post:
      operationId: createDebt
      tags: [debts]
      summary: Create debt record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInput"
      responses:
        "201":
          description: Debt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  /debts/{debtId}:
    get:
      operationId: getDebt
      tags: [debts]
      summary: Get debt with payment history
      parameters:
        - name: debtId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtWithPayments"
    patch:
      operationId: updateDebt
      tags: [debts]
      summary: Update debt
      parameters:
        - name: debtId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtUpdate"
      responses:
        "200":
          description: Updated debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  /debts/{debtId}/transfer:
    post:
      operationId: transferDebtItems
      tags: [debts]
      summary: Move selected outstanding debt items to another customer
      parameters:
        - name: debtId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtTransferInput"
      responses:
        "201":
          description: Debt items moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  sourceDebtId:
                    type: string
                  targetDebt:
                    $ref: "#/components/schemas/Debt"
                  sourceDebt:
                    $ref: "#/components/schemas/Debt"
                required: [sourceDebtId, targetDebt, sourceDebt]

  /debts/{debtId}/payments:
    post:
      operationId: recordDebtPayment
      tags: [debts]
      summary: Record a payment against a debt
      parameters:
        - name: debtId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtPaymentInput"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtPayment"

  /debts/{debtId}/payments/{paymentId}/reverse:
    post:
      operationId: reverseDebtPayment
      tags: [debts]
      summary: Reverse an incorrectly recorded payment
      parameters:
        - name: debtId
          in: path
          required: true
          schema:
            type: string
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtPaymentReversalInput"
      responses:
        "201":
          description: Reversal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtPayment"
        "409":
          description: Payment already reversed

  # ─── INVENTORY MOVEMENTS ─────────────────────────────────
  /inventory-movements:
    get:
      operationId: listInventoryMovements
      tags: [inventory]
      summary: List inventory movements
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: productId
          in: query
          schema:
            type: string
        - name: movementType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryMovement"

  # ─── NOTIFICATIONS ────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: unreadOnly
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── AUDIT LOG ───────────────────────────────────────────
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  # ─── SUPPLIERS ───────────────────────────────────────────
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Suppliers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{supplierId}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete supplier
      parameters:
        - name: supplierId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── REPORTS / ANALYTICS ─────────────────────────────────
  /reports/dashboard:
    get:
      operationId: getDashboard
      tags: [reports]
      summary: Dashboard summary for today or a date
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
          description: YYYY-MM-DD, defaults to today
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /reports/range:
    get:
      operationId: getReportRange
      tags: [reports]
      summary: Sales report for a date range
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Range report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RangeReport"

  /reports/top-products:
    get:
      operationId: getTopProducts
      tags: [reports]
      summary: Top products by revenue or profit
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  /reports/category-breakdown:
    get:
      operationId: getCategoryBreakdown
      tags: [reports]
      summary: Revenue and profit breakdown by category
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /reports/hourly:
    get:
      operationId: getHourlySales
      tags: [reports]
      summary: Sales by hour for a given date
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Hourly breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourlySales"

  /reports/debts-summary:
    get:
      operationId: getDebtsSummary
      tags: [reports]
      summary: Debt summary totals
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Debts summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtsSummary"

  # ─── OCR ─────────────────────────────────────────────────
  /ocr/scan:
    post:
      operationId: ocrScan
      tags: [ocr]
      summary: Process OCR scan of notebook/invoice image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrScanInput"
      responses:
        "200":
          description: OCR scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrScanResult"

  /ocr/sessions:
    get:
      operationId: listScanSessions
      tags: [ocr]
      summary: List scan sessions
      parameters:
        - name: shopId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Scan sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanSession"
    post:
      operationId: createScanSession
      tags: [ocr]
      summary: Create a scan session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"

  /ocr/sessions/{sessionId}/apply:
    post:
      operationId: applyScanSession
      tags: [ocr]
      summary: Apply confirmed OCR results to inventory
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyScanInput"
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyScanResult"

  # ─── STORAGE ─────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResult"

  /storage/objects/{objectPath}:
    get:
      operationId: getObject
      tags: [storage]
      summary: Serve stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object file

components:
