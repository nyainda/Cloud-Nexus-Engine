        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string
      required: [applied, skipped, errors]

    # ─── STORAGE ──────────────────────────────────────────
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
      required: [name, size, contentType]

    UploadUrlResult:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required: [uploadURL, objectPath]
