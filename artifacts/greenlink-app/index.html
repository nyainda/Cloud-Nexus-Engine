<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>GreenLink OS</title>
    <meta name="description" content="GreenLink OS — Professional retail management for agrovet businesses." />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="GreenLink OS" />
    <meta property="og:description" content="Professional retail OS for agrovet businesses." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GreenLink OS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com">
    <style>
      html, body, #root { height: 100%; background: #0A0A0A; margin: 0; }
      #app-splash {
        position: fixed; inset: 0; background: #0A0A0A; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        transition: opacity 0.3s ease;
      }
      #app-splash.hidden { opacity: 0; pointer-events: none; }
      .splash-icon { width: 64px; height: 64px; border-radius: 18px; background: #C8FF00; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(200,255,0,0.25); }
      .splash-title { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; font-family: system-ui, sans-serif; margin: 0; }
      .splash-sub { color: rgba(255,255,255,0.35); font-size: 12px; font-family: system-ui, sans-serif; margin: 2px 0 0; text-align: center; }
      .splash-spinner { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(200,255,0,0.2); border-top-color: #C8FF00; animation: splash-spin 0.75s linear infinite; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div style="text-align:center">
        <p class="splash-title">GreenLink OS</p>
        <p class="splash-sub">Agrovet Retail Management</p>
      </div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
