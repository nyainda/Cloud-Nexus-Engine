kind = "web"
previewPath = "/"
title = "GreenLink POS"
version = "1.0.0"
id = "artifacts/greenlink-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19001

[services.development]
run = "pnpm --filter @workspace/greenlink-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/greenlink-app", "run", "build" ]
publicDir = "artifacts/greenlink-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19001"
BASE_PATH = "/"
